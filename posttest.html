<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CEFR Final Examination on Reading Skills Test</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:#e0f7ff;
    user-select:none;
}
.flash-alert { animation: flash 0.4s alternate infinite; }
@keyframes flash {
    from { background: black; }
    to { background: transparent; }
}

.header{text-align:center;padding:20px}
.header img{width:130px}

.timer{text-align:center;font-size:22px;font-weight:bold;margin-bottom:10px;color:#ffc107}

.container{
    width:90%;
    margin:auto;
    background:rgba(0,0,0,0.55);
    padding:25px;
    border-radius:12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}

table{width:100%;border-collapse:collapse;margin-bottom:20px}
td{border:1px solid #00e5ff;padding:10px}
input{width:96%;padding:8px;background:#fff;color:#000;border:none;border-radius:4px;font-weight:bold}

.question{
    border:1px solid #00e5ff;
    padding:15px;
    margin-bottom:20px;
    border-radius:8px;
    background:rgba(255,255,255,0.03);
}

.choice{
    padding:8px 12px;
    margin:6px 0;
    border:1px solid #aaa;
    border-radius:5px;
    cursor:pointer;
    transition: 0.2s;
}
.choice:hover { background: rgba(0, 229, 255, 0.2); }
.choice.selected{background:#ccefff;color:#000;font-weight:bold;}
.choice.correct{background:#d4edda;color:#155724;font-weight:bold;}
.choice.wrong{background:#f8d7da;color:#721c24;font-weight:bold;}

.answer-review{
    margin-top:10px;
    padding:10px;
    background:rgba(255,255,255,0.1);
    border-radius:6px;
    font-size:14px;
}

button{
    padding:12px 24px;
    font-size:16px;
    font-weight:bold;
    border:none;
    border-radius:8px;
    margin:10px;
    cursor:pointer;
    transition:0.2s;
}

.btn-submit { background:#00e5ff; color:#000; }
.btn-cert { background:#ffc107; color:#000; }
.btn-print { background:#28a745; color:#fff; }
button:hover { transform: translateY(-2px); filter: brightness(1.1); }

/* Security Overlay */
#securityOverlay{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.95);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    animation:blink 0.6s infinite;
}

#securityOverlay h1{ color:#fff; font-size:38px; text-align:center; }
@keyframes blink{ 0%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:1;} }
.freeze *{ pointer-events:none !important; }
#result{text-align:center;font-size:18px;margin-top:20px}

@media print {
    body { background: #fff !important; color: #000 !important; }
    .no-print, button, .timer { display: none !important; }
    .container { background: #fff !important; color: #000 !important; box-shadow: none !important; width: 100% !important; padding: 0 !important; }
    .question { border: 1px solid #ccc !important; background: #fff !important; page-break-inside: avoid; }
    .choice { border: 1px solid #999 !important; }
}
</style>
</head>

<body

onpaste="return false"
oncontextmenu="return false"
ondragstart="return false"
onselectstart="return false">

<div id="examPage">
    <div class="header">
        <img src="https://image2url.com/r2/default/images/1769014503355-aed3a663-edee-4712-974b-a5aa8787a845.png" alt="School Logo">
        <h1>CEFR Final Examination on Reading Skills Test</h1>
        <h2>Chumphon Vocational College</h2>
        <h3>General Relations Department</h3>
    </div>

    <div class="timer" id="timer">Time Remaining: 90:00</div>

    <div class="container">
        <table>
        <tr><td>Subject</td><td><input id="stuSubject" value="English Reading Proficiency Assessment (CEFR A1-C2)"></td></tr>
        <tr><td>Name of Student</td><td><input id="stuName" placeholder="Enter Full Name"></td></tr>
        <tr><td>Student ID Number</td><td><input id="stuID" placeholder="Enter ID Number"></td></tr>
        <tr><td>Department</td><td><input id="stuDept" placeholder="Enter Department"></td></tr>
        <tr><td>Teacher</td><td><input id="stuTeacher" value="Mr. Jose Cer Gapay Bundalian"></td></tr>

        <div id="questions"></div>

        <div style="text-align:center">
            <button class="btn-submit" onclick="submitExam()">Submit Examination</button>
            <button class="btn-cert" onclick="generateAndRedirect()">Convert to Certificate</button>
            <button class="btn-print" onclick="window.print()">Save Test PDF</button>
        </div>

    </div>
</div>

<script>
// Exam Timer Logic
let timeLeft=900;
let timerInterval = setInterval(()=>{
    let m=Math.floor(timeLeft/60);
    let s=timeLeft%60;
    document.getElementById("timer").textContent=
    `Time Remaining: ${m}:${s.toString().padStart(2,"0")}`;
    timeLeft--;
},1000);

const questions = [
/* PART I – CEFR A1 */
{q:`<b>Part I – CEFR A1 (Basic User)</b><br><br><b>Reading Passage: My Name is Anna</b><br><br>Hello! My name is Anna. I am eighteen years old. I live in Thailand with my family. Every morning I wake up at six o'clock. I eat breakfast and go to school by bus. My favorite subject is English because I like talking to people from different countries.<br><br>`,o:["Continue"],c:0},
{q:"1. What is the girl's name?",o:["Amanda","Anna","Amy","Alice"],c:1},
{q:"2. How old is she?",o:["Seventeen","Nineteen","Eighteen","Twenty"],c:2},
{q:"3. Where does she live?",o:["In Vietnam","In Malaysia","In Thailand","In Cambodia"],c:2},
{q:"4. What time does she wake up?",o:["Five o'clock","Seven o'clock","Six o'clock","Eight o'clock"],c:2},
{q:"5. How does she go to school?",o:["By car","By bus","By train","On foot"],c:1},
{q:"6. What is her favorite subject?",o:["Math","English","Science","History"],c:1},
{q:"7. Why does she like English?",o:["Because her friends like it","Because she likes talking to people from different countries","Because it's easy","Because of the teacher"],c:1},
{q:"8. True or False: Anna walks to school.",o:["False","True","Not mentioned","Depends"],c:0},
{q:"9. True or False: Anna lives alone.",o:["Sometimes","True","False","Not mentioned"],c:2},
{q:"10. Which sentence best describes Anna?",o:["She is a teacher working abroad.","She dislikes waking up early.","She is a student who enjoys learning English and lives in Thailand.","She travels by train every day."],c:2},

/* PART II – CEFR A2 */
{q:`<b>Part II – CEFR A2 (Elementary)</b><br><br><b>Reading Passage: Healthy Habits</b><br><br>Eating fruits and vegetables every day helps people stay healthy. Doctors also recommend drinking plenty of water and exercising at least three times a week. Sleeping for eight hours each night is another important habit that improves health and concentration.<br><br>`,o:["Continue"],c:0},
{q:"11. What foods should people eat every day?",o:["Meat and dairy","Fruits and vegetables","Fast food and snacks","Sweets and soft drinks"],c:1},
{q:"12. How often should people exercise?",o:["At least three times a week","Once a week","Twice a week","Every hour"],c:0},
{q:"13. How many hours should people sleep?",o:["Six hours","Eight hours","Seven hours","Nine hours"],c:1},
{q:"14. Why is sleep important?",o:["It makes you tired","It improves health and concentration","It helps you stay awake all night","It replaces eating"],c:1},
{q:"15. What do doctors recommend drinking?",o:["Sodas","Coffee","Juice only","Plenty of water"],c:3},
{q:"16. True or False: Exercise is unhealthy.",o:["False","True","Not mentioned","Sometimes true"],c:0},
{q:"17. Which habit improves concentration?",o:["Skipping meals","Sleeping for eight hours each night","Working late","Watching TV"],c:1},
{q:"18. Which word is closest to 'recommend'?",o:["Forbid","Ignore","Advise","Deny"],c:2},
{q:"19. What is the passage mainly about?",o:["Cooking recipes","Healthy habits","Sports training","Medical research"],c:1},
{q:"20. Which habit do you practice most often?",o:["Exercising daily","Drinking water","Sleeping eight hours","Eating vegetables"],c:1},

/* PART III – CEFR B1 */
{q:`<b>Part III – CEFR B1 (Intermediate)</b><br><br><b>Reading Passage: Online Learning</b><br><br>Many students now use online platforms to improve their English. They can watch videos, complete quizzes, and participate in discussions. Although online learning offers flexibility, students must manage their time well to succeed.<br><br>`,o:["Continue"],c:0},
{q:"21. What is the main idea?",o:["Students should stop going to school.","Online learning helps students improve English but requires time management.","Online platforms are too difficult.","Videos are better than books."],c:1},
{q:"22. Name two online activities.",o:["Running and swimming","Watching videos and completing quizzes","Cooking and cleaning","Sleeping and eating"],c:1},
{q:"23. Why is flexibility important?",o:["It makes tests harder","It allows students to study at their own convenience","It removes all challenges","It guarantees high scores"],c:1},
{q:"24. What challenge does online learning have?",o:["Finding computers","Managing time well","No internet anywhere","Too many teachers"],c:1},
{q:"25. What does 'participate' mean?",o:["To watch silently","To leave early","To take part","To ignore"],c:2},
{q:"26. True or False: Students never communicate online.",o:["False","True","Not mentioned","Partially true"],c:0},
{q:"27. Why is time management important?",o:["To waste time","To succeed in online learning","To avoid studying","To sleep more"],c:1},
{q:"28. Which sentence best summarizes the passage?",o:["Online learning is impossible without a classroom.","Online learning provides flexibility for improving English, but requires good time management.","Students hate online quizzes.","Technology replaces the need to practice."],c:1},
{q:"29. What is the author's purpose?",o:["To advertise a website","To inform readers about online learning benefits and challenges","To complain about technology","To discourage students"],c:1},
{q:"30. Give one advantage of online learning.",o:["Strict schedules","No interaction","Flexibility","Mandatory attendance"],c:2},

/* PART IV – CEFR B2 */
{q:`<b>Part IV – CEFR B2 (Upper Intermediate)</b><br><br><b>Reading Passage: Artificial Intelligence in Education</b><br><br>Artificial Intelligence (AI) is becoming an important part of education. AI-powered systems can personalize lessons, provide immediate feedback, and identify areas where students need improvement. However, educators believe AI should support teachers rather than replace them because human interaction remains essential for developing communication skills and emotional intelligence.<br><br>`,o:["Continue"],c:0},
{q:"31. What is AI used for in education?",o:["To completely replace all human work","To grade papers randomly","To personalize lessons and provide feedback","To stop student progress"],c:2},
{q:"32. What does 'personalize' mean?",o:["To make public","To tailor to individual needs","To randomize completely","To complicate"],c:1},
{q:"33. Why shouldn't AI replace teachers?",o:["Because computers are too expensive","Because AI cannot process data","Because human interaction remains essential for communication skills and emotional intelligence","Because students dislike computers"],c:2},
{q:"34. Give two benefits of AI.",o:["Cooking food and cleaning rooms","Personalizing lessons and providing immediate feedback","Driving cars and flying planes","Building furniture and painting walls"],c:1},
{q:"35. What skills require human interaction?",o:["Math calculation only","Communication skills and emotional intelligence","Memory retention","Typing speed"],c:1},
{q:"36. What is the author's opinion?",o:["AI should run schools entirely","AI should support teachers, not replace them","AI has no place in education","Teachers are no longer needed"],c:1},
{q:"37. Which sentence is supported by the passage?",o:["AI can completely replace human emotions.","Human interaction is essential for developing emotional intelligence.","Teachers disagree that AI provides feedback.","Students prefer robots over teachers."],c:1},
{q:"38. What does 'immediate feedback' mean?",o:["Delayed grading after a month","No response at all","Instant responses to student work","Secret scores"],c:2},
{q:"39. What is the tone of the passage?",o:["Angry and aggressive","Humorous","Balanced and informative","Pessimistic"],c:2},
{q:"40. Summarize the passage in one sentence.",o:["AI makes teachers obsolete.","AI enhances education by supporting teachers, but human interaction remains irreplaceable.","Technology is ruining schools.","Computers teach better than humans."],c:1},

/* PART V – CEFR C1 */
{q:`<b>Part V – CEFR C1 (Advanced)</b><br><br><b>Reading Passage: The Digital Transformation of Society</b><br><br>The rapid advancement of digital technology has fundamentally transformed modern society. While innovations have significantly increased productivity and global connectivity, they have simultaneously introduced ethical concerns surrounding privacy, misinformation, and cybersecurity. Governments, businesses, and individuals must collaborate to maximize technological benefits while minimizing potential risks.<br><br>`,o:["Continue"],c:0},
{q:"41. What is the central argument?",o:["Technology should be banned due to security risks.","Society must balance technological benefits with ethical risks through collaboration.","Productivity is the only metric that matters.","Governments should control all digital tools."],c:1},
{q:"42. What ethical concerns are mentioned?",o:["High costs and slow internet speeds","Privacy, misinformation, and cybersecurity","Lack of devices and poor design","Unemployment only"],c:1},
{q:"43. What does 'fundamentally transformed' imply?",o:["A temporary trend","A deep, structural change in how society operates","A minor cosmetic upgrade","A regression in progress"],c:1},
{q:"44. Why is collaboration important?",o:["To slow down technology","To maximize benefits while minimizing risks","To increase government control","To eliminate competition"],c:1},
{q:"45. Identify one cause-and-effect relationship.",o:["Privacy concerns caused technology to disappear.","Digital advancement increased global connectivity, but introduced privacy concerns.","Misinformation stopped productivity entirely.","Collaboration eliminated all digital innovation."],c:1},
{q:"46. What is the writer's viewpoint?",o:["Entirely opposed to technology","Pragmatic and cautious about digital transformation","Unaware of risks","Overly optimistic without reservations"],c:1},
{q:"47. Infer the meaning of 'simultaneously.'",o:["In sequence","At the same time","Eventually","Rarely"],c:1},
{q:"48. Which statement best reflects the author's opinion?",o:["Technology has only negative consequences.","Technology brings great connectivity and productivity, but requires careful risk management.","Cybersecurity issues are impossible to fix.","Individuals have no role in digital safety."],c:1},
{q:"49. Identify the organizational pattern.",o:["Chronological story","Cause and effect / Problem and solution","Simple list of definitions","Comparison of two books"],c:1},
{q:"50. Write a brief summary.",o:["Technology is bad for privacy.","Digital tech transforms society with benefits and risks, requiring collective management.","Governments should manage computers.","Society is completely digital now."],c:1},

/* PART VI – CEFR C2 */
{q:`<b>Part VI – CEFR C2 (Proficiency)</b><br><br><b>Reading Passage: The Complexity of Human Progress</b><br><br>Human civilization has consistently advanced through scientific discovery and technological innovation. Nevertheless, genuine progress cannot be measured solely by economic prosperity or technological sophistication. Sustainable development requires balancing economic growth with environmental stewardship, ethical governance, cultural preservation, and social equity. Failure to reconcile these competing priorities may result in long-term consequences that outweigh short-term achievements. Consequently, policymakers are increasingly challenged to formulate strategies that integrate interdisciplinary perspectives while remaining responsive to rapidly evolving global circumstances.<br><br>`,o:["Continue"],c:0},
{q:"51. What is the thesis of the passage?",o:["Economic growth is the ultimate measure of civilization.","True progress requires balancing economic growth with environmental, ethical, cultural, and social factors.","Technology solves all environmental problems.","Policymakers should ignore global circumstances."],c:1},
{q:"52. Why isn't economic growth alone enough?",o:["Because money has no value.","Because sustainable development demands environmental stewardship, equity, and ethical governance.","Because technology replaces economics.","Because progress is impossible."],c:1},
{q:"53. Explain 'environmental stewardship.'",o:["Exploiting natural resources quickly","Responsible care and protection of the environment","Ignoring climate issues","Building more factories"],c:1},
{q:"54. What does 'reconcile competing priorities' mean?",o:["To choose one goal and ignore the rest","To find a balance among conflicting goals or demands","To eliminate all policies","To speed up economic output"],c:1},
{q:"55. Infer the meaning of 'interdisciplinary.'",o:["Confined to a single subject","Involving multiple academic disciplines or fields of study","Irrelevant to policy","Purely economic"],c:1},
{q:"56. Identify the author's tone.",o:["Lighthearted and casual","Analytical, serious, and visionary","Dismissive and sarcastic","Indifferent"],c:1},
{q:"57. What assumption does the author make?",o:["Technology always ensures social equity.","Unbalanced growth creates long-term negative consequences.","Policymakers always make perfect choices.","Economic prosperity fixes cultural concerns automatically."],c:1},
{q:"58. Evaluate the argument presented.",o:["It is overly narrow and focuses only on money.","It is comprehensive and highlights the multidimensional nature of sustainable progress.","It ignores environmental issues entirely.","It lacks logical coherence."],c:1},
{q:"59. Write a critical summary (80–100 words).",o:["Human progress is purely economic.","The passage argues that true human progress goes beyond mere economic and technological metrics. Sustainable development necessitates a delicate equilibrium encompassing environmental protection, ethical governance, cultural preservation, and social equity. Failing to balance these multi-faceted priorities invites severe long-term consequences that eclipse short-term successes. Therefore, modern policymakers face the intricate challenge of crafting adaptive, interdisciplinary strategies that respond effectively to rapidly changing global circumstances and ensure enduring societal well-being.","Technology measures all civilization.","Policymakers must ignore the environment."],c:1},
{q:"60. Suggest one solution to achieve sustainable development.",o:["Stopping all scientific discovery","Integrating interdisciplinary perspectives into policymaking to balance economic and environmental goals","Focusing solely on financial output","Ignoring global circumstances"],c:1}
];

const qDiv=document.getElementById("questions");
let answers=new Array(questions.length).fill(null);
let currentScore = 0;
let isSubmitted = false;

questions.forEach((q,i)=>{
    let box=document.createElement("div");
    box.className="question";
    box.innerHTML=`<b>${q.q}</b><br>`;
    q.o.forEach((opt,idx)=>{
        let d=document.createElement("div");
        d.className="choice";
        d.textContent=`${String.fromCharCode(65+idx)}. ${opt}`;
        d.onclick=()=>{
            if(isSubmitted) return;
            box.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
            answers[i]=idx;
            d.classList.add("selected");
        };
        box.appendChild(d);
    });
    qDiv.appendChild(box);
});

function calculateCEFR(score) {
    let level = "A1";
    let pct = Math.round((score / 60) * 100);
    
    if (score >= 54) level = "C2";
    else if (score >= 46) level = "C1";
    else if (score >= 36) level = "B2";
    else if (score >= 24) level = "B1";
    else if (score >= 12) level = "A2";
    else level = "A1";

    return { level, percentage: pct };
}

function submitExam(){
    let score=0;
    answers.forEach((a,i)=>{
        const box=qDiv.children[i];
        const correct=questions[i].c;
        const choices=box.querySelectorAll(".choice");

        if(a===correct){
            score++;
            if(choices[a]) choices[a].classList.add("correct");
        }else{
            if(a!==null && choices[a]) choices[a].classList.add("wrong");
            if(choices[correct]) choices[correct].classList.add("correct");
        }
    });

    currentScore = score;
    isSubmitted = true;
    let evalData = calculateCEFR(score);

    document.getElementById("result").innerHTML=`
    <h3>EXAM RESULT SUMMARY</h3>
    Raw Score: <b>${score} / 60</b><br>
    Percentage Score: <b>${evalData.percentage}%</b><br>
    CEFR Reading Level: <b>${evalData.level}</b>
    `;
}

function generateAndRedirect() {
    if(!isSubmitted) {
        submitExam();
    }

    let name = document.getElementById("stuName").value.trim() || "Student Name";
    let id = document.getElementById("stuID").value.trim() || "N/A";
    let dept = document.getElementById("stuDept").value.trim() || "General Studies";
    let teacher = document.getElementById("stuTeacher").value.trim() || "Mr. Jose Cer Gapay Bundalian";
    let evalData = calculateCEFR(currentScore);

    // Build complete answer review summary to embed in test PDF
    let testReviewHtml = "";
    questions.forEach((q, i) => {
        let userAns = answers[i] !== null ? q.o[answers[i]] : "No Answer";
        let correctAns = q.o[q.c];
        let statusColor = (answers[i] === q.c) ? "#27ae60" : "#c0392b";
        
        testReviewHtml += `
            <div style="border: 1px solid #ddd; padding: 10px; margin-bottom: 8px; border-radius: 4px; background: #fafafa;">
                <div style="font-size:13px; font-weight:bold;">${q.q}</div>
                <div style="font-size:12px; margin-top:4px; color:${statusColor};">Your Answer: <b>${userAns}</b></div>
                <div style="font-size:12px; color:#27ae60;">Correct Answer: <b>${correctAns}</b></div>
            </div>
        `;
    });

    const studentData = {
        name: name,
        id: id,
        dept: dept,
        teacher: teacher,
        rawScore: currentScore,
        percentage: evalData.percentage,
        cefrLevel: evalData.level,
        testReviewHtml: testReviewHtml,
        issueDate: new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
    };

    // Save payload to localStorage and redirect
    localStorage.setItem("cefrStudentResult", JSON.stringify(studentData));
    window.location.href = "certificate.html";
}
</script>

<script>
/* SECURITY CONTROLS */
let examFrozen = false;

function freezeExam(reason){
    if(examFrozen) return;
    examFrozen = true;
    document.body.classList.add("freeze");
    document.getElementById("securityOverlay").style.display="flex";
    const alarm=document.getElementById("alarmSound");
    if(alarm){ alarm.volume=1; alarm.play().catch(()=>{}); }
    alert(reason + "\nExam will be submitted automatically.");
    setTimeout(()=>{ submitExam(); },3000);
}

window.addEventListener("beforeunload",e=>{
    if(!isSubmitted){
        e.preventDefault();
        e.returnValue="";
    }
});

document.addEventListener("keyup",e=>{
    if(e.key==="PrintScreen"||e.keyCode===44){
        freezeExam("Screenshot detected!");
    }
});

document.addEventListener("visibilitychange",()=>{
    if(document.hidden && !isSubmitted){
        freezeExam("You left the exam window!");
    }
});

window.addEventListener("blur",()=>{
    if(!isSubmitted){
        freezeExam("Exam window lost focus!");
    }
});

document.addEventListener("keydown",e=>{
    if(e.ctrlKey && ["c","v","x","p","s","u"].includes(e.key.toLowerCase())){
        e.preventDefault();
        freezeExam("Restricted key pressed!");
    }
});

["copy","paste","cut","contextmenu"].forEach(evt=>{
    document.addEventListener(evt,e=>{
        e.preventDefault();
        freezeExam("Restricted action detected!");
    });
});
</script>

<audio id="alarmSound" loop>
    <source src="https://image2url.com/r2/default/audio/1769311028308-f1317f8e-a263-48aa-b094-95803b516508.mp3" type="audio/mpeg">
</audio>

<div id="securityOverlay">
    <h1>⚠ EXAM VIOLATION DETECTED ⚠<br>SCREENSHOT AND COPY PASTE ARE NOT ALLOWED</h1>
</div>

</body>
</html>
